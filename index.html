<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>캡차 입력</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 20px;
    font: 20px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; gap: 16px; align-items: center;
  }
  h1 { font-size: 22px; margin: 0; text-align: center; }
  #sub { font-size: 16px; color: #94a3b8; margin: -8px 0 0; text-align: center; }
  #img {
    width: 100%; max-width: 520px; border-radius: 12px;
    background: #fff; display: block; min-height: 90px;
  }
  #ans {
    width: 100%; max-width: 520px; font-size: 40px; text-align: center;
    padding: 14px; border-radius: 12px; border: 3px solid #38bdf8;
    background: #fff; color: #000; letter-spacing: 6px;
  }
  .row { display: flex; gap: 10px; width: 100%; max-width: 520px; }
  button {
    flex: 1; font-size: 24px; font-weight: 700; padding: 18px 10px;
    border: 0; border-radius: 12px; color: #fff; background: #2563eb;
  }
  button.sub { background: #475569; font-size: 18px; font-weight: 500; }
  button:active { opacity: .7; }
  #msg { font-size: 18px; min-height: 28px; text-align: center; }
  .ok { color: #4ade80; } .err { color: #f87171; }
</style>
</head>
<body>

<h1>🏕️ 캡차 입력</h1>
<p id="sub">그림의 숫자를 입력하고 전송하세요</p>

<img id="img" alt="캡차 이미지">

<input id="ans" type="text" inputmode="numeric" autocomplete="off"
       autocapitalize="off" autocorrect="off" placeholder="숫자">

<div class="row">
  <button id="send">전송</button>
</div>
<div class="row">
  <button class="sub" id="recap">새 이미지</button>
  <button class="sub" id="skip">이 자리 포기</button>
</div>

<div id="msg"></div>

<script>
(function () {
  var q     = new URLSearchParams(location.search);
  var topic = q.get('topic') || '';
  var img   = q.get('img')   || '';
  var slot  = q.get('slot')  || '';

  var $img = document.getElementById('img');
  var $ans = document.getElementById('ans');
  var $msg = document.getElementById('msg');
  var $sub = document.getElementById('sub');

  if (slot) $sub.textContent = slot + ' — 그림의 숫자를 입력하세요';
  if (img)  $img.src = img;
  else      $msg.textContent = '이미지 주소가 없습니다.';

  function say(t, cls) { $msg.textContent = t; $msg.className = cls || ''; }

  function send(text, done) {
    if (!topic) { say('토픽이 지정되지 않았습니다.', 'err'); return; }
    say('전송 중…');
    fetch('https://ntfy.sh/' + encodeURIComponent(topic), {
      method: 'POST', body: text
    }).then(function (r) {
      if (r.ok) { say('✅ 전송됨: ' + text, 'ok'); if (done) done(); }
      else say('❌ 전송 실패 (' + r.status + ')', 'err');
    }).catch(function () { say('❌ 네트워크 오류', 'err'); });
  }

  document.getElementById('send').onclick = function () {
    var v = $ans.value.trim();
    if (!v) { say('숫자를 입력하세요.', 'err'); return; }
    send('!c ' + v);
  };
  document.getElementById('recap').onclick = function () {
    send('!recap', function () {
      // 새 이미지가 올라올 시간을 준 뒤, 최근 메시지에서 최신 캡차 주소를 찾아 교체
      setTimeout(function () {
        fetch('https://ntfy.sh/' + encodeURIComponent(topic) + '/json?poll=1&since=1m')
          .then(function (r) { return r.text(); })
          .then(function (t) {
            var urls = t.match(/https:\/\/ntfy\.sh\/file\/[A-Za-z0-9]+\.png/g);
            if (urls && urls.length) {
              $img.src = urls[urls.length - 1];
              $ans.value = '';
              say('새 이미지를 불러왔습니다.', 'ok');
            } else say('새 이미지를 찾지 못했습니다.', 'err');
          });
      }, 2500);
    });
  };
  document.getElementById('skip').onclick = function () {
    if (!slot) { say('자리번호 정보가 없습니다.', 'err'); return; }
    var num = slot.replace(/[^0-9\-]/g, '');
    send('!skip ' + num);
  };

  $ans.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('send').click();
  });
  setTimeout(function () { $ans.focus(); }, 300);
})();
</script>
</body>
</html>
