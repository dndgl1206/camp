<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>캡차 입력</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 18px 18px 40px;
    font: 20px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    background: #0f172a; color: #e2e8f0;
    display: flex; flex-direction: column; gap: 14px; align-items: center;
  }
  h1 { font-size: 22px; margin: 0; text-align: center; }
  #sub { font-size: 17px; color: #94a3b8; margin: -6px 0 0; text-align: center; }
  #img {
    width: 100%; max-width: 520px; border-radius: 12px;
    background: #fff; display: block; min-height: 100px;
  }
  #ans {
    width: 100%; max-width: 520px; font-size: 42px; text-align: center;
    padding: 14px; border-radius: 12px; border: 3px solid #38bdf8;
    background: #fff; color: #000; letter-spacing: 8px;
  }
  .row { display: flex; gap: 10px; width: 100%; max-width: 520px; }
  button {
    flex: 1; font-size: 24px; font-weight: 700; padding: 18px 10px;
    border: 0; border-radius: 12px; color: #fff; background: #2563eb;
  }
  button.sub { background: #475569; font-size: 17px; font-weight: 500; padding: 14px 8px; }
  button:active { opacity: .6; }
  #msg { font-size: 18px; min-height: 26px; text-align: center; }
  .ok { color: #4ade80; } .err { color: #f87171; } .dim { color: #94a3b8; }
  #skips, #dates { width: 100%; max-width: 520px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip.date { background: #1e3a8a; color: #dbeafe; }
  .chip.date span { background: #3b82f6; }
  .chip {
    background: #7f1d1d; color: #fee2e2; border-radius: 999px;
    padding: 10px 14px; font-size: 17px; display: flex; align-items: center; gap: 8px;
  }
  .chip b { font-weight: 700; }
  .chip span { background: #ef4444; color: #fff; border-radius: 999px;
               width: 26px; height: 26px; display: inline-flex;
               align-items: center; justify-content: center; font-size: 16px; }
</style>
</head>
<body>

<h1>🏕️ 캡차 입력</h1>
<p id="sub">최신 캡차를 불러오는 중…</p>

<img id="img" alt="캡차 이미지">

<input id="ans" type="text" inputmode="numeric" autocomplete="off"
       autocapitalize="off" autocorrect="off" placeholder="숫자">

<div class="row"><button id="send">전송</button></div>
<div class="row">
  <button class="sub" id="reload">🔄 화면 갱신</button>
  <button class="sub" id="recap">그림 다시받기</button>
</div>
<div class="row">
  <button class="sub" id="skip">이 자리 포기</button>
  <button class="sub" id="status">상태 확인</button>
</div>
<div class="row">
  <button class="sub" id="mstop">⏹ 감시 중지</button>
  <button class="sub" id="mstart">▶ 감시 시작</button>
</div>
<div class="row">
  <button class="sub" id="skiplist">📋 감시날짜 · 제외목록 보기</button>
</div>

<div id="msg"></div>
<div id="dates"></div>
<div id="skips"></div>

<script>
(function () {
  // ───── 설정: 토픽을 여기 박아두면 주소만 열어도 동작 ─────
  var TOPIC_DEFAULT = 'camp-woong-123';

  var q     = new URLSearchParams(location.search);
  var topic = q.get('topic') || TOPIC_DEFAULT;
  var slot  = q.get('slot')  || '';
  var img   = q.get('img')   || '';

  var $img = document.getElementById('img');
  var $ans = document.getElementById('ans');
  var $msg = document.getElementById('msg');
  var $sub = document.getElementById('sub');
  var base = 'https://ntfy.sh/' + encodeURIComponent(topic);

  function say(t, cls) { $msg.textContent = t; $msg.className = cls || ''; }

  function send(text, done) {
    say('전송 중…', 'dim');
    fetch(base, { method: 'POST', body: text })
      .then(function (r) {
        if (r.ok) { say('✅ 보냄: ' + text, 'ok'); if (done) done(); }
        else if (r.status === 429) say('❌ ntfy 요청 한도 — 잠시 후 다시', 'err');
        else say('❌ 전송 실패 (' + r.status + ')', 'err');
      })
      .catch(function () { say('❌ 네트워크 오류', 'err'); });
  }

  // 최근 메시지에서 가장 최신 캡차 이미지와 자리번호를 찾아온다
  function loadLatest(quiet) {
    if (!quiet) say('불러오는 중…', 'dim');
    fetch(base + '/json?poll=1&since=15m')
      .then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      })
      .then(function (t) {
        var lines = t.split('\n').filter(function (x) { return x.trim(); });
        var found = null, foundTime = 0, foundSlot = '', foundDate = '';
        for (var i = 0; i < lines.length; i++) {
          var m;
          try { m = JSON.parse(lines[i]); } catch (e) { continue; }
          if (m.attachment && m.attachment.url &&
              /captcha/i.test(m.attachment.name || '') && m.time >= foundTime) {
            found = m.attachment.url; foundTime = m.time;
            // 스크립트가 실어보낸 'CAP|2026.09.29|1야영장 103번' 파싱
            var info = (m.message || '').split('|');
            if (info[0] === 'CAP') { foundDate = info[1] || ''; foundSlot = info[2] || ''; }
          }
        }
        // 옛 형식(정보 없음) 대비: '잡음' 알림 제목에서 보조 추출
        if (found && !foundSlot) {
          for (var k = 0; k < lines.length; k++) {
            var n;
            try { n = JSON.parse(lines[k]); } catch (e) { continue; }
            if (n.title && /잡음/.test(n.title) && Math.abs((n.time || 0) - foundTime) <= 10) {
              var sm = n.title.match(/([0-9]+야영장\s*[0-9\-]+번)/);
              if (sm) foundSlot = sm[1];
              var dm = n.title.match(/\((20[0-9]{2}\.[0-9]{2}\.[0-9]{2})\)/);
              if (dm) foundDate = dm[1];
            }
          }
        }
        if (found) {
          $img.src = found + '?t=' + Date.now();
          slot = foundSlot || slot;
          var ago = Math.max(0, Math.round(Date.now() / 1000 - foundTime));
          var agoTxt = ago < 60 ? ago + '초 전' : Math.round(ago / 60) + '분 전';
          $sub.textContent = (foundDate ? '📅 ' + foundDate + '\n' : '') +
                             (slot ? slot + ' · ' : '') + agoTxt + ' 캡차';
          $sub.style.whiteSpace = 'pre-line';
          $sub.style.fontSize = '19px';
          $sub.style.color = '#fbbf24';
          $ans.value = '';
          if (!quiet) say('불러왔습니다.', 'ok');
          setTimeout(function () { $ans.focus(); }, 200);
        } else {
          $sub.textContent = '최근 15분 내 캡차가 없습니다';
          say('대기 중 — PC가 자리를 잡으면 알림이 옵니다.', 'dim');
        }
      })
      .catch(function (e) { say('❌ 불러오기 실패 (' + e.message + ')', 'err'); });
  }

  document.getElementById('send').onclick = function () {
    var v = $ans.value.trim();
    if (!v) { say('숫자를 입력하세요.', 'err'); return; }
    send('!c ' + v);
  };
  document.getElementById('reload').onclick = function () { loadLatest(false); };
  document.getElementById('recap').onclick = function () {
    send('!recap', function () { setTimeout(function () { loadLatest(true); }, 3000); });
  };
  document.getElementById('skip').onclick = function () {
    var num = (slot || '').replace(/^[0-9]+야영장\s*/, '').replace(/[^0-9\-]/g, '');
    if (!num) { say('자리번호를 알 수 없습니다.', 'err'); return; }
    send('!skip ' + num);
  };
  document.getElementById('status').onclick = function () { askStatus(true); };
  document.getElementById('mstop').onclick  = function () { send('!stop'); };
  document.getElementById('mstart').onclick = function () { send('!start'); };
  document.getElementById('skiplist').onclick = function () { askStatus(false); };

  // PC에 !status 를 보내고, 돌아온 응답에서 임시제외 목록을 뽑아 보여준다
  function askStatus(showAll) {
    var sentAt = Math.floor(Date.now() / 1000);
    say('PC에 상태 요청 중…', 'dim');
    fetch(base, { method: 'POST', body: '!status' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); })
      .then(function () { setTimeout(function () { readStatus(sentAt, showAll, 0); }, 3000); })
      .catch(function (e) { say('❌ 요청 실패 (' + e.message + ')', 'err'); });
  }

  function readStatus(sentAt, showAll, tries) {
    fetch(base + '/json?poll=1&since=2m')
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var lines = t.split('\n').filter(function (x) { return x.trim(); });
        var latest = null;
        for (var i = 0; i < lines.length; i++) {
          var m; try { m = JSON.parse(lines[i]); } catch (e) { continue; }
          if (m.title && /상태/.test(m.title) && (m.time || 0) >= sentAt) latest = m;
        }
        if (!latest) {
          if (tries < 6) { setTimeout(function () { readStatus(sentAt, showAll, tries + 1); }, 4000); return; }
          say('❌ PC 응답 없음 — 원격명령이 꺼졌거나 PC가 멈췄습니다.', 'err');
          return;
        }
        if (showAll) say(latest.message, 'ok');
        else say('제외 목록을 불러왔습니다.', 'ok');
        renderDates(latest.message || '');
        renderSkips(latest.message || '');
      })
      .catch(function () { say('❌ 응답 읽기 실패', 'err'); });
  }

  // '날짜: 2026.09.13 / 2026.09.26' → 칩으로 렌더, ✕ 로 해당 날짜 감시 해제
  var curDates = [];
  function renderDates(msg) {
    var box = document.getElementById('dates');
    box.innerHTML = '';
    var line = (msg.split('\n').filter(function (x) { return /^날짜:/.test(x.trim()); })[0] || '');
    var body = line.replace(/^.*날짜:\s*/, '').trim();
    if (!body) { box.innerHTML = '<div class="dim" style="font-size:17px">감시 날짜 정보 없음</div>'; return; }

    curDates = body.split('/').map(function (x) { return x.trim().replace(/[^0-9]/g, ''); })
                   .filter(function (x) { return x.length === 8; });
    curDates.forEach(function (d) {
      var el = document.createElement('div');
      el.className = 'chip date';
      el.innerHTML = '<b>' + d.slice(4, 6) + '/' + d.slice(6) + '</b><span>✕</span>';
      el.querySelector('span').onclick = function () {
        if (curDates.length <= 1) { say('마지막 날짜는 뺄 수 없습니다. 멈추려면 [⏹ 감시 중지].', 'err'); return; }
        var rest = curDates.filter(function (x) { return x !== d; });
        send('!date ' + rest.join(','), function () {
          curDates = rest;
          el.remove();
        });
      };
      box.appendChild(el);
    });
  }

  // '임시제외: 1-129(46분) 999(49분)' → 해제 버튼으로 렌더
  function renderSkips(msg) {
    var box = document.getElementById('skips');
    box.innerHTML = '';
    var line = (msg.split('\n').filter(function (x) { return /임시제외/.test(x); })[0] || '');
    var body = line.replace(/^.*임시제외:\s*/, '').trim();
    if (!body || body === '없음') {
      box.innerHTML = '<div class="dim" style="font-size:17px">임시제외 없음</div>';
      return;
    }
    body.split(/\s+/).forEach(function (tok) {
      var num = tok.replace(/\(.*$/, '').replace(/^[0-9]+-/, '');
      if (!num) return;
      var el = document.createElement('div');
      el.className = 'chip';
      el.innerHTML = '<b>' + tok + '</b><span>✕</span>';
      el.querySelector('span').onclick = function () {
        send('!unskip ' + num, function () { el.remove(); });
      };
      box.appendChild(el);
    });
  }

  $ans.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('send').click();
  });

  // 알림으로 들어왔으면 그 이미지를, 그냥 열었으면 최신을 찾아온다
  if (img) {
    $img.src = img;
    var d0 = q.get('date') || '';
    $sub.textContent = (d0 ? '📅 ' + d0 + '\n' : '') +
                       (slot ? slot + ' — 그림의 숫자를 입력하세요' : '그림의 숫자를 입력하세요');
    $sub.style.whiteSpace = 'pre-line';
    $sub.style.color = '#fbbf24';
    setTimeout(function () { $ans.focus(); }, 300);
  } else {
    loadLatest(true);
  }

  // 앱 전환 후 화면으로 돌아왔을 때 자동으로 최신 확인
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !q.get('img')) loadLatest(true);
  });
})();
</script>
</body>
</html>
